<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>Gusanitoxmega</title>

<meta name="theme-color" content="#39ff88">

<link rel="manifest" href="manifest.json">

<link rel="stylesheet" href="style.css">

</head>


<body>


<!-- MENU INICIAL -->

<div id="menu">

<h1>🐍 Gusanitoxmega</h1>

<p>El juego del gusanito</p>

<button onclick="startGame()">
🎮 JUGAR
</button>

</div>



<!-- AREA DEL JUEGO -->

<div id="gameUI" class="hidden">


<div class="top">

<span id="score">
Puntos: 0
</span>


<span id="record">
Récord: 0
</span>


</div>



<canvas id="game" width="360" height="360"></canvas>




<div class="controls">


<button onclick="changeDir('up')">
⬆️
</button>


<br>


<button onclick="changeDir('left')">
⬅️
</button>


<button id="pauseBtn" onclick="pauseGame()">
⏸️
</button>


<button onclick="changeDir('right')">
➡️
</button>


<br>


<button onclick="changeDir('down')">
⬇️
</button>



</div>


</div>





<!-- PANTALLA GAME OVER -->


<div id="gameOver" class="hidden">


<h2>
💀 GAME OVER
</h2>


<p id="finalScore">
</p>


<button onclick="startGame()">

🔄 JUGAR DE NUEVO

</button>


</div>





<script src="game.js" defer></script>



<script>

if ("serviceWorker" in navigator) {

navigator.serviceWorker.register("service-worker.js")
.then(()=>console.log("PWA lista"))
.catch(error=>console.log(error));

}

</script>



</body>

</html>
