<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a1a2e">
    <title>Gusanitoxmega - Juego de la Serpiente</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <!-- Menú Principal -->
    <div id="menu" class="screen">
        <div class="container">
            <h1>🐍 GUSANITOXMEGA</h1>
            <p class="subtitle">El Juego de la Serpiente Definitivo</p>

            <div class="button-group">
                <button id="startButton" class="btn btn-primary">
                    <span>🎮 </span>Iniciar Juego
                </button>
                <button id="adventureButton" class="btn btn-secondary">
                    <span>🗺️ </span>Seleccionar Aventura
                </button>
                <button id="settingsButton" class="btn btn-tertiary">
                    <span>⚙️ </span>Ajustes
                </button>
            </div>

            <div id="highScoresList" class="high-scores"></div>
        </div>
    </div>

    <!-- Selección de Aventura -->
    <div id="adventureSelect" class="screen">
        <div class="container">
            <h2>🗺️ Selecciona una Aventura</h2>
            <div id="adventureList" class="adventure-grid"></div>
            <button id="backButton" class="btn btn-back">← Volver</button>
        </div>
    </div>

    <!-- Selección de Nivel -->
    <div id="levelSelect" class="screen">
        <div class="container">
            <h2>📋 Selecciona un Nivel</h2>
            <div id="levelList" class="level-grid"></div>
            <button id="backButton" class="btn btn-back">← Volver</button>
        </div>
    </div>

    <!-- Ajustes -->
    <div id="settings" class="screen">
        <div class="container">
            <h2>⚙️ Ajustes</h2>
            <div class="settings-form">
                <div class="setting">
                    <label>Tamaño de la cuadrícula:</label>
                    <input type="number" id="gridSize" min="10" max="30" value="20">
                </div>
            </div>
            <button id="backButton" class="btn btn-back">← Volver</button>
        </div>
    </div>

    <!-- UI del Juego -->
    <div id="gameUI" class="screen">
        <canvas id="gameCanvas"></canvas>
        <div class="game-info">
            <div id="levelName" class="info-item">Nivel 1 - Bosque Tranquilo</div>
            <div id="levelTarget" class="info-item">Objetivo: 10 pts</div>
            <div id="score" class="info-item">Puntuación: 0</div>
            <div id="highScore" class="info-item">Récord: 0</div>
        </div>
        <button id="pauseButton" class="btn-pause" onclick="pauseGame()">⏸️</button>
    </div>

    <!-- Menú de Pausa -->
    <div id="pauseMenu" class="overlay">
        <div class="overlay-content">
            <h2>⏸️ Pausa</h2>
            <button id="resumeButton" class="btn btn-primary">Continuar</button>
            <button id="restartButton" class="btn btn-secondary">Reiniciar Nivel</button>
            <button id="menuButton" class="btn btn-tertiary">Menú Principal</button>
        </div>
    </div>

    <!-- Nivel Completado -->
    <div id="levelComplete" class="overlay">
        <div class="overlay-content">
            <h2>🎉 ¡Nivel Completado!</h2>
            <p id="levelCompleteScore">Puntuación: 0</p>
            <button id="nextButton" class="btn btn-primary">Siguiente Nivel</button>
            <button id="menuButton" class="btn btn-secondary">Menú Principal</button>
        </div>
    </div>

    <!-- Aventura Completada -->
    <div id="adventureComplete" class="overlay">
        <div class="overlay-content">
            <h2>🏆 ¡Aventura Completada!</h2>
            <p id="adventureCompleteName">Aventura</p>
            <button id="menuButton" class="btn btn-primary">Menú Principal</button>
        </div>
    </div>

    <!-- Game Over -->
    <div id="gameOver" class="overlay">
        <div class="overlay-content">
            <h2>💀 Game Over</h2>
            <p id="gameOverScore">Puntuación: 0</p>
            <button id="restartButton" class="btn btn-primary">Reintentar</button>
            <button id="menuButton" class="btn btn-secondary">Menú Principal</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
