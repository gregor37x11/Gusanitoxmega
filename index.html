<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>Gusanitoxmega</title>

<meta name="theme-color" content="#39ff88">

<link rel="manifest" href="manifest.json">

<link rel="stylesheet" href="style.css">

</head>


<body>


<div id="menu">

<h1>🐍 Gusanitoxmega</h1>

<p>El juego del gusano</p>

<button onclick="startGame()">JUGAR</button>

</div>



<div id="gameUI" class="hidden">

<div class="top">

<span id="score">
Puntos: 0
</span>

<span id="record">
Récord: 0
</span>

</div>


<canvas id="game" width="360" height="360"></canvas>


<div class="controls">

<button onclick="changeDir('up')">⬆</button>

<div>

<button onclick="changeDir('left')">⬅</button>

<button onclick="pauseGame()">⏸</button>

<button onclick="changeDir('right')">➡</button>

</div>


<button onclick="changeDir('down')">⬇</button>


</div>


</div>



<div id="gameOver" class="hidden">

<h2>💀 Game Over</h2>

<p id="finalScore"></p>

<button onclick="startGame()">Jugar otra vez</button>

</div>



<script src="game.js"></script>


<script>

if("serviceWorker" in navigator){

navigator.serviceWorker.register("service-worker.js");

}

</script>


</body>

</html>
